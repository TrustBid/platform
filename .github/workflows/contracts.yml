name: Test contracts

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
      - 'scripts/contracts.sh'
  pull_request:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
      - 'scripts/contracts.sh'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 23.0.0
        run: |
          # Binario precompilado en vez de `cargo install --locked`: el árbol de
          # deps pineado de la CLI 23.0.0 (dep `ethnum`) ya no compila con el
          # rustc del runner (>=1.97), lo que rompió el CI. De paso evita ~10 min
          # de compilación por corrida.
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version

      - name: Run contract tests
        run: npm run contracts:test

      - name: Build WASM
        run: npm run contracts:build

      - name: Caatinga doctor
        run: npx caatinga doctor --network testnet --strict 2>&1 || echo "Doctor advisory warnings (non-fatal)"
